title = "Linguamate Gitleaks Configuration"

# Default rules are required. A config that only defines [[rules]] replaces
# the built-in rules, and the previous nested [allowlist.*] tables do not
# decode on Gitleaks 8.25+ (this file failed to load on 8.30.1).
[extend]
useDefault = true

# Global allowlists are OR-matched. Keep them narrow: path filters for
# generated and test trees, plus placeholder values. Do not allowlist secret
# shapes (bare hashes, JWTs, PANs); those suppress real findings.
[[allowlists]]
description = "Generated trees, dependencies, and test fixtures"
paths = [
  '''(^|/)node_modules(/|$)''',
  '''(^|/)\.git(/|$)''',
  '''(^|/)dist(/|$)''',
  '''(^|/)build(/|$)''',
  '''(^|/)coverage(/|$)''',
  '''(^|/)web-build(/|$)''',
  '''(^|/)\.expo(/|$)''',
  '''(^|/)android(/|$)''',
  '''(^|/)ios(/|$)''',
  '''(^|/)__tests__(/|$)''',
  '''(^|/)tests?(/|$)''',
  '''(^|/)fixtures(/|$)''',
  '''(^|/)mocks(/|$)''',
  '''(^|/)stubs(/|$)''',
  '''\.(test|spec)\.[^/]+$''',
]

[[allowlists]]
description = "Obvious placeholders and local test credentials"
regexTarget = "secret"
regexes = [
  '''(?i)^(test|dummy|fake|mock)_(api|token|key|secret)_[0-9a-f]{8,32}$''',
  '''(?i)^(test|dummy|fake|mock)_(password|pwd|pass)_[0-9a-f]{8,32}$''',
  '''(?i)^(change_me|your_.+_here|<.*>|\$\{.*\})$''',
  '''^postgresql://test:test@localhost:5432/test$''',
  '''^mysql://test:test@localhost:3306/test$''',
  '''^mongodb://test:test@localhost:27017/test$''',
  '''(?i)^(test@example\.com|admin@test\.com|user@localhost|test@localhost|example@example\.com)$''',
]

# No extra [[rules]]. The previous linguamate-specific pattern matched any
# project name followed by hex (changelog lines, lockfile hashes) and hid
# the default-rule results. Default rules from [extend].useDefault are the scan.