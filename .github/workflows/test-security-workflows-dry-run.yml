name: 🔒 Test Security Workflows (Dry Run)

on:
  workflow_dispatch:
    inputs:
      security_tool:
        description: 'Security tool to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - semgrep
          - gitleaks
          - codeql
          - npm-audit
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# contents: read is enough to checkout full history and run local scanners.
permissions:
  contents: read

concurrency:
  group: test-security-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Pin the release asset itself. /releases/latest/download/<old filename>
  # follows the latest tag and 404s once that filename is no longer published.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  test-semgrep:
    name: 🔍 Test Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.security_tool == 'all' || github.event.inputs.security_tool == 'semgrep'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test Semgrep configuration
        run: |
          echo "Testing Semgrep configuration..."
          if [ -f ".semgrep.yml" ]; then
            echo ".semgrep.yml found"
          else
            echo "No .semgrep.yml found, checking for inline config"
          fi

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --dry-run .
          semgrep --config=p/security-audit --dry-run .
          semgrep --config=p/secrets --dry-run .

  test-gitleaks:
    name: 🔍 Test Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.security_tool == 'all' || github.event.inputs.security_tool == 'gitleaks'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL -o "${asset}" "${url}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          rm -f "${asset}"
          gitleaks version

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          rm -f "${report}"
          trap 'rm -f "${report}"' EXIT
          set +e
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-level info \
            --report-format json \
            --report-path "${report}" \
            --exit-code 1
          status=$?
          set -e
          REPORT="${report}" python3 - <<'PY'
          import collections
          import json
          import os

          path = os.environ["REPORT"]
          findings = []
          if os.path.exists(path) and os.path.getsize(path):
              with open(path) as handle:
                  data = json.load(handle)
              if isinstance(data, list):
                  findings = data

          counts = collections.Counter(str(item.get("RuleID") or "unknown") for item in findings)
          lines = [f"gitleaks findings: {len(findings)}", "count by rule:"]
          for rule, count in sorted(counts.items()):
              lines.append(f"  {rule}: {count}")
          lines.append("locations (secret values omitted):")
          for item in findings:
              secret = str(item.get("Secret") or "")
              match = str(item.get("Match") or "")
              rule = item.get("RuleID") or "unknown"
              file = item.get("File") or ""
              commit = item.get("Commit") or ""
              line = item.get("StartLine") if item.get("StartLine") is not None else ""
              if secret not in ("", "REDACTED") or (match and "REDACTED" not in match):
                  lines.append(f"  UNSAFE redaction rule={rule} file={file} commit={commit} line={line}")
                  continue
              lines.append(f"  rule={rule} file={file} commit={commit} line={line}")
          text = "\n".join(lines) + "\n"
          print(text, end="")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as handle:
                  handle.write("## Gitleaks\n\n```\n")
                  handle.write(text)
                  handle.write("```\n")
          PY
          exit "${status}"

  test-codeql:
    name: 🔍 Test CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.security_tool == 'all' || github.event.inputs.security_tool == 'codeql'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test CodeQL configuration
        run: |
          echo "Testing CodeQL configuration..."
          if find .github/workflows -name "*.yml" -o -name "*.yaml" | xargs grep -l "codeql" > /dev/null; then
            echo "CodeQL workflows found"
          else
            echo "No CodeQL workflows found"
          fi

      - name: Test CodeQL setup
        run: |
          if command -v codeql >/dev/null 2>&1; then
            codeql version
          else
            echo "CodeQL CLI is not installed on this runner"
          fi

  test-npm-audit:
    name: 🔍 Test NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.security_tool == 'all' || github.event.inputs.security_tool == 'npm-audit'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail on high and critical advisories. Moderate and low are printed
      # by npm audit and do not fail the job. Same threshold as `npm run audit:ci`.
      - name: npm audit
        run: |
          echo "npm audit threshold: high (fails on high and critical; moderate and low do not fail the job)"
          npm run audit:ci

  test-security-config:
    name: 🔧 Test Security Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.security_tool == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate security configuration files
        run: |
          security_files=(
            ".semgrep.yml"
            ".gitleaks.toml"
            ".github/dependabot.yml"
            ".github/workflows/security.yml"
            ".github/workflows/gitleaks.yml"
            ".github/workflows/semgrep.yml"
            "package.json"
            "package-lock.json"
          )
          for file in "${security_files[@]}"; do
            if [ -f "$file" ]; then
              echo "found $file"
            else
              echo "missing $file"
            fi
          done

      - name: Check for security best practices
        run: |
          if [ -f ".gitignore" ] && grep -q "\.env" .gitignore; then
            echo ".env files are ignored"
          else
            echo ".gitignore does not mention .env"
            exit 1
          fi

  security-test-report:
    name: 📊 Security Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-semgrep, test-gitleaks, test-codeql, test-npm-audit, test-security-config]
    if: always()
    steps:
      - name: Generate security test report
        run: |
          echo "# Security workflow results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep | ${{ needs.test-semgrep.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitleaks | ${{ needs.test-gitleaks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | ${{ needs.test-codeql.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NPM Audit | ${{ needs.test-npm-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Config | ${{ needs.test-security-config.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks and npm audit fail the workflow when they find secrets or high/critical advisories." >> "$GITHUB_STEP_SUMMARY"
