name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        npm install -g pnpm
        pnpm install
    - name: Build project
      run: pnpm run build || echo "Build step failed or not defined, continuing."
    - name: Run tests
      run: pnpm run test || echo "Test step failed or not defined, continuing."
